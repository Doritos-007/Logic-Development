<ion-content [fullscreen]="true" class="page-content"><main class="mobile-page delivery-page"><app-brand-header></app-brand-header><h1 class="screen-title">Entrega</h1><p class="screen-subtitle">Elige la forma de recibir tu pedido</p><app-checkout-steps [active]="2"></app-checkout-steps>
<section class="method-list"><button class="method" [class.selected]="state.selectedDelivery==='standard'" (click)="select('standard')"><ion-icon name="car-outline"></ion-icon><div><h2>Envío estándar</h2><small>3–5 días hábiles</small><strong>$90 MXN</strong><p>Recibe en la comodidad<br/>de tu hogar u oficina.</p></div><span class="radio">✓</span></button><button class="method" [class.selected]="state.selectedDelivery==='express'" (click)="select('express')"><ion-icon class="orange" name="flash-outline"></ion-icon><div><h2>Entrega exprés</h2><small>1–2 días hábiles</small><strong>$150 MXN</strong><p>Para que disfrutes tu café<br/>más pronto.</p></div><span class="radio"></span></button><button class="method" [class.selected]="state.selectedDelivery==='pickup'" (click)="select('pickup')"><ion-icon name="storefront-outline"></ion-icon><div><h2>Recoger en tienda</h2><small>1 día hábil</small><strong>Gratis</strong><p>Recoge en nuestra tienda<br/>en Tuxtla Gutiérrez.</p></div><span class="radio"></span></button></section>
<div class="impact"><ion-icon name="leaf-outline"></ion-icon><span>Tu pedido apoya a caficultores<br/>mexicanos y comunidades locales.</span></div><button class="primary-btn" (click)="next()">Continuar</button><app-bottom-nav active="cart" [count]="state.cartCount()"></app-bottom-nav></main></ion-content>
