<ion-content [fullscreen]="true" class="auth-content">
  <main class="login-screen">
    <section class="brand" aria-label="Café Cuauhtémoc">
      <img src="assets/img/logo-cafe-cuauhtemoc.png" alt="Logotipo Café Cuauhtémoc" class="brand-logo" />
      <h1>Café Cuauhtémoc</h1>
      <p>Café de calidad, directo del origen a tu taza.</p>
    </section>

    <section class="auth-card">
      <header class="card-header">
        <h2>Bienvenido</h2>
        <p>Inicia sesión para explorar y comprar<br />tus productos favoritos.</p>
      </header>

      <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <div class="input-shell" [class.invalid]="loginForm.controls.email.invalid && loginForm.controls.email.touched">
            <ion-icon name="mail-outline" aria-hidden="true"></ion-icon>
            <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="correo@ejemplo.com" formControlName="email" />
          </div>
          <small class="error" *ngIf="loginForm.controls.email.touched && loginForm.controls.email.hasError('required')">Ingresa tu correo electrónico.</small>
          <small class="error" *ngIf="loginForm.controls.email.touched && loginForm.controls.email.hasError('email')">Ingresa un correo válido.</small>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-shell" [class.invalid]="loginForm.controls.password.invalid && loginForm.controls.password.touched">
            <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
            <input id="password" [type]="showPassword ? 'text' : 'password'" autocomplete="current-password" placeholder="••••••••" formControlName="password" />
            <button class="icon-button" type="button" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
          <small class="error" *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">La contraseña debe tener al menos 6 caracteres.</small>
        </div>

        <button type="submit" class="primary-button">Entrar</button>
      </form>

      <p class="status-message" *ngIf="statusMessage">{{ statusMessage }}</p>

      <div class="divider" aria-hidden="true"><span></span><b>o</b><span></span></div>

      <button type="button" class="guest-button" (click)="continueAsGuest()">
        <ion-icon name="cart-outline" aria-hidden="true"></ion-icon>
        <span>Continuar como invitado</span>
      </button>

      <div class="create-account">
        <span>¿No tienes una cuenta?</span>
        <button type="button" (click)="goToRegister()">Crear cuenta</button>
      </div>
    </section>
  </main>
</ion-content>
