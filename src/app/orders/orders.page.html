<ion-content [fullscreen]="true" class="page-content"><main class="mobile-page orders-page"><app-brand-header></app-brand-header><h1 class="screen-title">Mis pedidos</h1><p class="screen-subtitle">Consulta el estado de tus pedidos<br/>y revive tus mejores momentos.</p><div class="filter-chips"><button *ngFor="let f of filters" [class.active]="filter===f" (click)="filter=f">{{ f }}</button></div><section class="orders-list"><article class="order-card card" *ngFor="let order of orders" (click)="open()"><img src="assets/img/product-pergamino.png"/><div><h2>{{ order.id }}</h2><small>{{ order.date }}</small><small>{{ order.count }}</small><strong>{{ order.total }}</strong></div><div class="order-side"><span [class]="'status '+order.cls">{{ order.status }}</span><ion-icon name="chevron-forward-outline"></ion-icon><button type="button">Ver detalles</button></div></article></section><app-bottom-nav active="profile" [count]="state.cartCount()"></app-bottom-nav></main></ion-content>
