<ion-content [fullscreen]="true" class="register-content">
  <main class="register-screen">
    <header class="topbar">
      <button type="button" class="back-button" (click)="back()" aria-label="Volver al inicio de sesión">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1>Crear cuenta</h1>
      <span class="topbar-spacer" aria-hidden="true"></span>
    </header>

    <section class="brand" aria-label="Café Cuauhtémoc">
      <img
        src="assets/img/logo-cafe-cuauhtemoc.png"
        alt="Logotipo Café Cuauhtémoc"
        class="brand-logo"
      />
      <h2>Café Cuauhtémoc</h2>
      <p>Únete a nuestra comunidad cafetera</p>
    </section>

    <form [formGroup]="registerForm" (ngSubmit)="submit()" novalidate>
      <div class="form-group">
        <label for="name">Nombre</label>
        <div class="input-shell" [class.invalid]="registerForm.controls.name.invalid && registerForm.controls.name.touched">
          <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
          <input id="name" type="text" autocomplete="given-name" placeholder="Juan" formControlName="name" />
        </div>
      </div>

      <div class="form-group">
        <label for="lastName">Apellidos</label>
        <div class="input-shell" [class.invalid]="registerForm.controls.lastName.invalid && registerForm.controls.lastName.touched">
          <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
          <input id="lastName" type="text" autocomplete="family-name" placeholder="Pérez García" formControlName="lastName" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <div class="input-shell" [class.invalid]="registerForm.controls.email.invalid && registerForm.controls.email.touched">
          <ion-icon name="mail-outline" aria-hidden="true"></ion-icon>
          <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="juan@ejemplo.com" formControlName="email" />
        </div>
      </div>

      <div class="form-group">
        <label for="phone">Teléfono</label>
        <div class="input-shell" [class.invalid]="registerForm.controls.phone.invalid && registerForm.controls.phone.touched">
          <ion-icon name="call-outline" aria-hidden="true"></ion-icon>
          <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+52 55 1234 5678" formControlName="phone" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-shell" [class.invalid]="registerForm.controls.password.invalid && registerForm.controls.password.touched">
          <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
          <input id="password" [type]="showPassword ? 'text' : 'password'" autocomplete="new-password" placeholder="••••••••" formControlName="password" />
          <button type="button" class="icon-button" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar contraseña</label>
        <div class="input-shell" [class.invalid]="(registerForm.controls.confirmPassword.invalid || registerForm.hasError('passwordMismatch')) && registerForm.controls.confirmPassword.touched">
          <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
          <input id="confirmPassword" [type]="showConfirmPassword ? 'text' : 'password'" autocomplete="new-password" placeholder="••••••••" formControlName="confirmPassword" />
          <button type="button" class="icon-button" (click)="toggleConfirmPassword()" [attr.aria-label]="showConfirmPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
        <small class="error" *ngIf="registerForm.hasError('passwordMismatch') && registerForm.controls.confirmPassword.touched">
          Las contraseñas no coinciden.
        </small>
      </div>

      <label class="terms-row">
        <input type="checkbox" formControlName="terms" />
        <span class="custom-check" aria-hidden="true"><ion-icon name="checkmark-outline"></ion-icon></span>
        <span>
          Acepto los <a href="#" (click)="$event.preventDefault()">Términos y Condiciones</a><br />
          y la <a href="#" (click)="$event.preventDefault()">Política de Privacidad.</a>
        </span>
      </label>
      <small class="error terms-error" *ngIf="registerForm.controls.terms.touched && registerForm.controls.terms.invalid">
        Debes aceptar los términos y condiciones.
      </small>

      <button type="submit" class="primary-button">Crear cuenta</button>
    </form>

    <p class="status-message" *ngIf="statusMessage">{{ statusMessage }}</p>

    <div class="login-link">
      <span>¿Ya tienes una cuenta?</span>
      <button type="button" (click)="back()">Iniciar sesión</button>
    </div>
  </main>
</ion-content>
